<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN Admin Panel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #070707;
            --dark: #111111;
            --dark2: #171717;
            --gold: #c7a66b;
            --gold-light: #ead29a;
            --white: #f5f1e9;
            --gray: #99938b;
            --border: rgba(199, 166, 107, 0.28);
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
        }
        body { background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        #adminLogin { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--black); }
        #adminLogin .login-box { background: var(--dark2); padding: 50px; border: 1px solid var(--gold); border-radius: 12px; max-width: 420px; width: 100%; }
        #adminLogin .login-box .logo { text-align: center; margin-bottom: 30px; }
        #adminLogin .login-box .logo img { width: 100px; height: auto; }
        #adminLogin .login-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--gold-light); text-align: center; margin-bottom: 8px; }
        #adminLogin .login-box p.subtitle { color: var(--gray); text-align: center; font-size: 13px; margin-bottom: 30px; }
        #adminLogin .login-box form { display: grid; gap: 16px; }
        #adminLogin .login-box input { padding: 14px 18px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 6px; font-size: 14px; transition: .3s; }
        #adminLogin .login-box input:focus { outline: none; border-color: var(--gold); }
        #adminLogin .login-box .btn { width: 100%; padding: 14px; margin-top: 10px; border: 1px solid var(--gold); background: var(--gold); color: #080808; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: .3s; font-weight: 600; }
        #adminLogin .login-box .btn:hover { background: var(--gold-light); }
        #adminLogin .login-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }
        #adminPanel { display: none; min-height: 100vh; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: var(--dark2); border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; margin: -20px -20px 20px -20px; flex-wrap: wrap; gap: 15px; }
        .admin-header .logo-area { display: flex; align-items: center; gap: 15px; }
        .admin-header .logo-area img { width: 50px; height: auto; }
        .admin-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--gold-light); }
        .admin-header .header-actions { display: flex; gap: 12px; align-items: center; }
        .admin-header .header-actions .user-info { color: var(--gray); font-size: 12px; margin-right: 10px; }
        .admin-header .header-actions .user-info strong { color: var(--white); }
        .btn-logout { padding: 10px 20px; background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; cursor: pointer; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; transition: .3s; }
        .btn-logout:hover { background: var(--danger); color: white; }
        .admin-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; padding: 10px 0; border-bottom: 1px solid #222; }
        .admin-nav button { padding: 12px 24px; background: transparent; border: 1px solid #333; color: var(--gray); border-radius: 6px; cursor: pointer; transition: .3s; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .admin-nav button:hover { border-color: var(--gold); color: var(--gold-light); }
        .admin-nav button.active { border-color: var(--gold); color: var(--gold-light); background: rgba(199, 166, 107, 0.1); }
        .admin-section { display: none; padding: 10px 0; }
        .admin-section.active { display: block; }
        .table-container { overflow-x: auto; background: var(--dark2); border-radius: 8px; border: 1px solid #222; }
        .table-container table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table-container th { text-align: left; padding: 14px 16px; background: #1a1a1a; color: var(--gray); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; }
        .table-container td { padding: 12px 16px; border-bottom: 1px solid #222; vertical-align: middle; }
        .table-container tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .table-container .product-image-cell { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.active { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .status-badge.inactive { background: rgba(153, 153, 153, 0.2); color: var(--gray); }
        .status-badge.pendiente { background: rgba(243, 156, 18, 0.2); color: var(--warning); }
        .status-badge.procesando { background: rgba(52, 152, 219, 0.2); color: #3498db; }
        .status-badge.enviado { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .status-badge.entregado { background: rgba(46, 204, 113, 0.3); color: #27ae60; }
        .status-badge.cancelado { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 16px; padding: 4px 6px; transition: .3s; border-radius: 4px; }
        .action-btn.edit { color: var(--gold-light); }
        .action-btn.edit:hover { background: rgba(199, 166, 107, 0.2); }
        .action-btn.delete { color: var(--danger); }
        .action-btn.delete:hover { background: rgba(231, 76, 60, 0.2); }
        .action-btn.view { color: #3498db; }
        .action-btn.view:hover { background: rgba(52, 152, 219, 0.2); }
        .action-btn.toggle { color: var(--warning); }
        .action-btn.toggle:hover { background: rgba(243, 156, 18, 0.2); }
        .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: 1px solid var(--gold); background: var(--gold); color: #080808; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: .3s; font-weight: 600; }
        .btn-primary:hover { background: var(--gold-light); }
        .btn-secondary { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: 1px solid #444; background: transparent; color: var(--gray); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: .3s; }
        .btn-secondary:hover { border-color: var(--gold); color: var(--gold-light); }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); padding: 20px; }
        .modal-overlay .modal-box { max-width: 600px; width: 100%; background: var(--dark2); border: 1px solid var(--gold); border-radius: 12px; padding: 40px; max-height: 90vh; overflow-y: auto; }
        .modal-overlay .modal-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--gold-light); margin-bottom: 25px; }
        .modal-overlay .modal-box .form-group { display: grid; gap: 6px; margin-bottom: 16px; }
        .modal-overlay .modal-box .form-group label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
        .modal-overlay .modal-box .form-group input, .modal-overlay .modal-box .form-group select, .modal-overlay .modal-box .form-group textarea { padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 6px; font-size: 13px; font-family: 'Inter', sans-serif; transition: .3s; }
        .modal-overlay .modal-box .form-group input:focus, .modal-overlay .modal-box .form-group select:focus, .modal-overlay .modal-box .form-group textarea:focus { outline: none; border-color: var(--gold); }
        .modal-overlay .modal-box .form-group textarea { resize: vertical; min-height: 80px; }
        .modal-overlay .modal-box .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .modal-overlay .modal-box .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal-overlay .modal-box .modal-actions .btn-primary { flex: 1; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
        .empty-state i { font-size: 48px; margin-bottom: 20px; color: #333; }
        .empty-state p { font-size: 14px; }
        .loading { text-align: center; padding: 40px; color: var(--gray); }
        .loading i { font-size: 32px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 25px; }
        .stat-card { background: var(--dark2); padding: 20px; border-radius: 8px; border: 1px solid #222; }
        .stat-card .stat-number { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--gold-light); }
        .stat-card .stat-label { color: var(--gray); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        @media (max-width: 768px) {
            .admin-header { flex-direction: column; align-items: stretch; padding: 15px 20px; }
            .admin-header .header-actions { flex-wrap: wrap; justify-content: space-between; }
            .admin-nav button { flex: 1; min-width: 100px; text-align: center; font-size: 10px; padding: 10px 16px; }
            .modal-overlay .modal-box { padding: 25px; }
            .modal-overlay .modal-box .form-row { grid-template-columns: 1fr; }
            .table-container { font-size: 12px; }
            .table-container th, .table-container td { padding: 8px 10px; }
            #adminLogin .login-box { padding: 30px 20px; }
        }
        @media (max-width: 480px) {
            .admin-nav button { min-width: 80px; font-size: 9px; padding: 8px 12px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="adminLogin">
        <div class="login-box">
            <div class="logo">
                <img src="https://iili.io/Ckog2lR.md.jpg" alt="KN Luxury Watches">
            </div>
            <h2>Panel de Administración</h2>
            <p class="subtitle">Acceso exclusivo para administradores</p>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
                <button type="submit" class="btn">Iniciar Sesión</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel">
        <div class="admin-header">
            <div class="logo-area">
                <img src="https://iili.io/Ckog2lR.md.jpg" alt="KN">
                <h1>Administración</h1>
            </div>
            <div class="header-actions">
                <span class="user-info">
                    <i class="fa-regular fa-user"></i>
                    <strong id="adminUserName">Admin</strong>
                </span>
                <button class="btn-logout" onclick="logoutAdmin()">
                    <i class="fa-solid fa-sign-out-alt"></i> Cerrar sesión
                </button>
            </div>
        </div>

        <nav class="admin-nav">
            <button class="active" data-section="products"><i class="fa-solid fa-box"></i> Productos</button>
            <button data-section="categories"><i class="fa-solid fa-tags"></i> Categorías</button>
            <button data-section="orders"><i class="fa-solid fa-clipboard-list"></i> Pedidos</button>
            <button data-section="testimonials"><i class="fa-solid fa-comments"></i> Testimonios</button>
        </nav>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-number" id="statProducts">0</div><div class="stat-label">Productos</div></div>
            <div class="stat-card"><div class="stat-number" id="statOrders">0</div><div class="stat-label">Pedidos</div></div>
            <div class="stat-card"><div class="stat-number" id="statCategories">0</div><div class="stat-label">Categorías</div></div>
            <div class="stat-card"><div class="stat-number" id="statTestimonials">0</div><div class="stat-label">Testimonios</div></div>
        </div>

        <div class="admin-section active" id="section-products">
            <div class="toolbar">
                <button class="btn-primary" onclick="showProductForm()"><i class="fa-solid fa-plus"></i> Nuevo Producto</button>
            </div>
            <div class="table-container" id="productsTable"><div class="loading"><i class="fa-solid fa-spinner"></i> Cargando...</div></div>
        </div>

        <div class="admin-section" id="section-categories">
            <div class="toolbar">
                <button class="btn-primary" onclick="showCategoryForm()"><i class="fa-solid fa-plus"></i> Nueva Categoría</button>
            </div>
            <div class="table-container" id="categoriesTable"><div class="loading"><i class="fa-solid fa-spinner"></i> Cargando...</div></div>
        </div>

        <div class="admin-section" id="section-orders">
            <div class="table-container" id="ordersTable"><div class="loading"><i class="fa-solid fa-spinner"></i> Cargando...</div></div>
        </div>

        <div class="admin-section" id="section-testimonials">
            <div class="toolbar">
                <button class="btn-primary" onclick="showTestimonialForm()"><i class="fa-solid fa-plus"></i> Nuevo Testimonio</button>
            </div>
            <div class="table-container" id="testimonialsTable"><div class="loading"><i class="fa-solid fa-spinner"></i> Cargando...</div></div>
        </div>
    </div>

    <div id="modalContainer"></div>

    <!-- CARGO SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <script>
        // ============================================
        // CONFIGURACIÓN SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://wrgvhnlhpkvendjhbtpm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyZ3ZobmxocGt2ZW5kamhidHBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzc4NTUsImV4cCI6MjEwMDc1Mzg1NX0.0lPt4xYWr4E3gWDm4K3z8igJXui1me_j-iKZo47KkcU';

        // USAR window.supabase QUE YA EXISTE (NO DECLARAR NUEVA VARIABLE)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let currentUser = null;
        let currentSection = 'products';
        let products = [];
        let categories = [];
        let orders = [];
        let testimonials = [];

        // ============================================
        // AUTENTICACIÓN
        // ============================================
        async function loginAdmin(email, password) {
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                currentUser = data.user;
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('adminUserName').textContent = data.user.email || 'Admin';
                loadSection('products');
                updateStats();
                return { success: true };
            } catch (error) {
                console.error('Login error:', error);
                return { success: false, error: error.message };
            }
        }

        async function logoutAdmin() {
            await supabase.auth.signOut();
            currentUser = null;
            document.getElementById('adminLogin').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'none';
        }

        // ============================================
        // CRUD - PRODUCTOS
        // ============================================
        async function loadProducts() {
            try {
                const { data, error } = await supabase.from('products').select('*').order('id', { ascending: false });
                if (error) throw error;
                products = data || [];
                renderProductsTable();
                updateStats();
                return data;
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsTable').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>Error: ${error.message}</p>
                        <p style="font-size:12px;margin-top:10px;color:#666;">¿Creaste la tabla "products" en Supabase?</p>
                    </div>
                `;
            }
        }

        async function createProduct(data) {
            try {
                const { error } = await supabase.from('products').insert([data]);
                if (error) throw error;
                await loadProducts();
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function updateProduct(id, data) {
            try {
                const { error } = await supabase.from('products').update(data).eq('id', id);
                if (error) throw error;
                await loadProducts();
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function deleteProduct(id) {
            if (!confirm('¿Eliminar este producto?')) return;
            try {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) throw error;
                await loadProducts();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ============================================
        // CRUD - CATEGORÍAS
        // ============================================
        async function loadCategories() {
            try {
                const { data, error } = await supabase.from('categories').select('*').order('name');
                if (error) throw error;
                categories = data || [];
                renderCategoriesTable();
                updateStats();
            } catch (error) {
                document.getElementById('categoriesTable').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>Error: ${error.message}</p>
                        <p style="font-size:12px;margin-top:10px;color:#666;">¿Creaste la tabla "categories" en Supabase?</p>
                    </div>
                `;
            }
        }

        async function createCategory(data) {
            try {
                const { error } = await supabase.from('categories').insert([data]);
                if (error) throw error;
                await loadCategories();
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function updateCategory(id, data) {
            try {
                const { error } = await supabase.from('categories').update(data).eq('id', id);
                if (error) throw error;
                await loadCategories();
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function deleteCategory(id) {
            if (!confirm('¿Eliminar esta categoría?')) return;
            try {
                const { error } = await supabase.from('categories').delete().eq('id', id);
                if (error) throw error;
                await loadCategories();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ============================================
        // CRUD - PEDIDOS
        // ============================================
        async function loadOrders() {
            try {
                const { data, error } = await supabase.from('orders').select('*, order_items(*)').order('created_at', { ascending: false });
                if (error) throw error;
                orders = data || [];
                renderOrdersTable();
                updateStats();
            } catch (error) {
                document.getElementById('ordersTable').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>Error: ${error.message}</p>
                        <p style="font-size:12px;margin-top:10px;color:#666;">¿Creaste la tabla "orders" en Supabase?</p>
                    </div>
                `;
            }
        }

        async function updateOrderStatus(id, status) {
            try {
                const { error } = await supabase.from('orders').update({ status, updated_at: new Date().toISOString() }).eq('id', id);
                if (error) throw error;
                await loadOrders();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ============================================
        // CRUD - TESTIMONIOS
        // ============================================
        async function loadTestimonials() {
            try {
                const { data, error } = await supabase.from('testimonials').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                testimonials = data || [];
                renderTestimonialsTable();
                updateStats();
            } catch (error) {
                document.getElementById('testimonialsTable').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <p>Error: ${error.message}</p>
                        <p style="font-size:12px;margin-top:10px;color:#666;">¿Creaste la tabla "testimonials" en Supabase?</p>
                    </div>
                `;
            }
        }

        async function createTestimonial(data) {
            try {
                const { error } = await supabase.from('testimonials').insert([data]);
                if (error) throw error;
                await loadTestimonials();
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function toggleTestimonial(id) {
            const item = testimonials.find(t => t.id === id);
            if (!item) return;
            try {
                const { error } = await supabase.from('testimonials').update({ is_active: !item.is_active }).eq('id', id);
                if (error) throw error;
                await loadTestimonials();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteTestimonial(id) {
            if (!confirm('¿Eliminar este testimonio?')) return;
            try {
                const { error } = await supabase.from('testimonials').delete().eq('id', id);
                if (error) throw error;
                await loadTestimonials();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ============================================
        // RENDER - PRODUCTOS
        // ============================================
        function renderProductsTable() {
            const container = document.getElementById('productsTable');
            if (!products.length) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No hay productos aún.</p></div>`;
                return;
            }
            let html = `<table><thead><tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th style="text-align:center;">Acciones</th></tr></thead><tbody>`;
            products.forEach(p => {
                html += `<tr>
                    <td>#${p.id}</td>
                    <td><div style="display:flex;align-items:center;gap:10px;"><img src="${p.image}" class="product-image-cell"><div><strong>${p.name}</strong></div></div></td>
                    <td>${p.category}</td>
                    <td>$${p.price.toLocaleString()}</td>
                    <td>${p.stock || 0}</td>
                    <td><span class="status-badge ${p.is_active ? 'active' : 'inactive'}">${p.is_active ? 'Activo' : 'Inactivo'}</span></td>
                    <td style="text-align:center;">
                        <button class="action-btn edit" onclick="showProductForm(${p.id})"><i class="fa-solid fa-pen"></i></button>
                        <button class="action-btn delete" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // RENDER - CATEGORÍAS
        // ============================================
        function renderCategoriesTable() {
            const container = document.getElementById('categoriesTable');
            if (!categories.length) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-tags"></i><p>No hay categorías aún.</p></div>`;
                return;
            }
            let html = `<table><thead><tr><th>Nombre</th><th>Slug</th><th>Estado</th><th style="text-align:center;">Acciones</th></tr></thead><tbody>`;
            categories.forEach(c => {
                html += `<tr>
                    <td><strong>${c.name}</strong></td>
                    <td><code style="background:#1a1a1a;padding:2px 8px;border-radius:4px;font-size:11px;">${c.slug}</code></td>
                    <td><span class="status-badge ${c.is_active ? 'active' : 'inactive'}">${c.is_active ? 'Activo' : 'Inactivo'}</span></td>
                    <td style="text-align:center;">
                        <button class="action-btn edit" onclick="showCategoryForm(${c.id})"><i class="fa-solid fa-pen"></i></button>
                        <button class="action-btn delete" onclick="deleteCategory(${c.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // RENDER - PEDIDOS
        // ============================================
        function renderOrdersTable() {
            const container = document.getElementById('ordersTable');
            if (!orders.length) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>No hay pedidos todavía.</p></div>`;
                return;
            }
            let html = `<table><thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Fecha</th><th style="text-align:center;">Acciones</th></tr></thead><tbody>`;
            orders.forEach(o => {
                const totalItems = o.order_items ? o.order_items.reduce((sum, i) => sum + i.quantity, 0) : 0;
                html += `<tr>
                    <td><strong>#${o.id}</strong></td>
                    <td>${o.customer_name}</td>
                    <td style="color:var(--gold-light);font-weight:600;">$${o.total_amount.toLocaleString()}</td>
                    <td>
                        <select onchange="updateOrderStatus(${o.id}, this.value)" style="padding:4px 8px;background:#1a1a1a;border:1px solid #333;color:white;border-radius:4px;font-size:11px;">
                            ${['pendiente','procesando','enviado','entregado','cancelado'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join('')}
                        </select>
                    </td>
                    <td style="font-size:11px;color:var(--gray);">${new Date(o.created_at).toLocaleDateString()}</td>
                    <td style="text-align:center;">
                        <button class="action-btn view" onclick="viewOrder(${o.id})"><i class="fa-solid fa-eye"></i></button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // RENDER - TESTIMONIOS
        // ============================================
        function renderTestimonialsTable() {
            const container = document.getElementById('testimonialsTable');
            if (!testimonials.length) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-comments"></i><p>No hay testimonios aún.</p></div>`;
                return;
            }
            let html = `<table><thead><tr><th>Cliente</th><th>Contenido</th><th>⭐</th><th>Estado</th><th style="text-align:center;">Acciones</th></tr></thead><tbody>`;
            testimonials.forEach(t => {
                html += `<tr>
                    <td><strong>${t.name}</strong>${t.location ? `<div style="font-size:11px;color:var(--gray);">${t.location}</div>` : ''}</td>
                    <td style="max-width:300px;color:var(--gray);font-size:12px;">"${t.content ? t.content.substring(0, 60) + (t.content.length > 60 ? '...' : '') : ''}"</td>
                    <td style="color:var(--gold-light);font-size:14px;">${'★'.repeat(t.rating || 5)}</td>
                    <td><span class="status-badge ${t.is_active ? 'active' : 'inactive'}">${t.is_active ? 'Activo' : 'Inactivo'}</span></td>
                    <td style="text-align:center;">
                        <button class="action-btn toggle" onclick="toggleTestimonial(${t.id})"><i class="fa-solid ${t.is_active ? 'fa-eye-slash' : 'fa-eye'}"></i></button>
                        <button class="action-btn delete" onclick="deleteTestimonial(${t.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // VER DETALLE DE PEDIDO
        // ============================================
        function viewOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;
            alert(`Pedido #${order.id}\nCliente: ${order.customer_name}\nTeléfono: ${order.customer_phone}\nTotal: $${order.total_amount.toLocaleString()}\nEstado: ${order.status}`);
        }

        // ============================================
        // STATS
        // ============================================
        function updateStats() {
            document.getElementById('statProducts').textContent = products.length;
            document.getElementById('statOrders').textContent = orders.length;
            document.getElementById('statCategories').textContent = categories.length;
            document.getElementById('statTestimonials').textContent = testimonials.length;
        }

        // ============================================
        // NAVEGACIÓN
        // ============================================
        function loadSection(section) {
            currentSection = section;
            document.querySelectorAll('.admin-nav button').forEach(btn => btn.classList.toggle('active', btn.dataset.section === section));
            document.querySelectorAll('.admin-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`section-${section}`).classList.add('active');
            switch(section) {
                case 'products': loadProducts(); break;
                case 'categories': loadCategories(); break;
                case 'orders': loadOrders(); break;
                case 'testimonials': loadTestimonials(); break;
            }
        }

        // ============================================
        // FORMULARIOS - VERSIÓN SIMPLIFICADA
        // ============================================
        function showProductForm(productId = null) {
            const product = productId ? products.find(p => p.id === productId) : null;
            const isEdit = !!product;
            const name = prompt(isEdit ? 'Editar nombre del producto:' : 'Nombre del producto:', isEdit ? product.name : '');
            if (name === null) return;
            const price = prompt(isEdit ? 'Editar precio:' : 'Precio:', isEdit ? product.price : '');
            if (price === null) return;
            
            const data = {
                name: name,
                category: product ? product.category : 'Clásicos',
                description: product ? product.description : 'Descripción del producto',
                image: product ? product.image : 'https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=1200&q=90',
                price: parseInt(price),
                stock: product ? product.stock : 10,
                movement: product ? product.movement : 'Automático',
                material: product ? product.material : 'Acero inoxidable',
                diameter: product ? product.diameter : '40 mm',
                water: product ? product.water : '100 metros',
                is_active: true
            };
            
            if (isEdit) {
                updateProduct(product.id, data);
            } else {
                createProduct(data);
            }
        }

        function showCategoryForm(categoryId = null) {
            const category = categoryId ? categories.find(c => c.id === categoryId) : null;
            const isEdit = !!category;
            const name = prompt(isEdit ? 'Editar nombre de la categoría:' : 'Nombre de la categoría:', isEdit ? category.name : '');
            if (name === null) return;
            
            const data = {
                name: name,
                slug: name.toLowerCase().replace(/\s+/g, '-'),
                description: category ? category.description : '',
                image: category ? category.image : '',
                is_active: true
            };
            
            if (isEdit) {
                updateCategory(category.id, data);
            } else {
                createCategory(data);
            }
        }

        function showTestimonialForm() {
            const name = prompt('Nombre del cliente:');
            if (name === null) return;
            const content = prompt('Contenido del testimonio:');
            if (content === null) return;
            
            createTestimonial({
                name: name,
                location: 'Buenos Aires',
                content: content,
                rating: 5,
                is_active: true
            });
        }

        // ============================================
        // EVENTOS
        // ============================================
        document.querySelectorAll('.admin-nav button').forEach(btn => {
            btn.addEventListener('click', () => loadSection(btn.dataset.section));
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            const result = await loginAdmin(email, password);
            if (!result.success) errorEl.textContent = result.error || 'Error al iniciar sesión';
        });

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        async function init() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    document.getElementById('adminLogin').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('adminUserName').textContent = session.user.email || 'Admin';
                    loadSection('products');
                    updateStats();
                }
            } catch (error) {
                console.error('Error en init:', error);
            }
        }

        // Iniciar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
